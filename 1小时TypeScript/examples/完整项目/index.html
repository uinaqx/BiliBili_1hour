<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TypeScript 课程示例：开销记录</title>
<style>
body{background:#091421;color:#eff5ff;font:20px system-ui;max-width:820px;margin:60px auto;padding:20px}
h1{color:#ffbd68}form{display:flex;gap:12px;flex-wrap:wrap}label{display:grid;gap:8px}
input,button{font:inherit;padding:10px;border:1px solid #41647e;border-radius:8px}
button{background:#19354b;color:#eff5ff;cursor:pointer}ul{padding:0;list-style:none}
li{display:flex;justify-content:space-between;align-items:center;background:#102237;padding:16px;margin:12px 0}
#message{color:#ffbd68;min-height:30px}small{color:#99afc6}
</style>
<h1>开销记录</h1>
<p>输入名称和金额，保存一条记录。</p>
<form id="expense-form" novalidate>
  <label>名称<input id="name" placeholder="例如：午餐"></label>
  <label>金额<input id="amount" inputmode="decimal" placeholder="例如：12.5"></label>
  <button type="submit">添加记录</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<ul id="items"></ul>
<p>总额：<strong id="total">0.00</strong> 元</p>
<small>记录保存在当前浏览器的本地存储中。</small>
<script type="module" src="dist/app.js"></script>
</html>
