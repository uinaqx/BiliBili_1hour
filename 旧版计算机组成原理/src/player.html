<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>计算机组成原理 · 120分钟</title>
<style>
:root{color-scheme:dark;--bg:#0b111c;--panel:#101b2b;--ink:#eaf0fa;--muted:#9bacbf;--blue:#45c4ff;--line:#27364c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px 'Noto Sans CJK SC',sans-serif}button,select{font:inherit;color:inherit;background:#17253a;border:1px solid var(--line);padding:8px 12px;border-radius:7px;cursor:pointer}button:hover{border-color:var(--blue)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue)}header{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;border-bottom:1px solid var(--line)}header strong{font-size:17px}small,.muted{color:var(--muted)}.badge{font-size:12px;border:1px solid #33536a;color:#8bdbff;padding:4px 8px;border-radius:20px}.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 65px)}nav{border-right:1px solid var(--line);padding:18px 12px;max-height:calc(100vh - 65px);overflow:auto}nav h3{font-size:13px;color:var(--muted);margin:18px 10px 8px}nav button{display:block;text-align:left;width:100%;background:transparent;border-color:transparent;font-size:13px;padding:9px;margin:2px 0}nav button.active{background:#133348;color:#8fddff}main{min-width:0;padding:20px}.screen-wrap{background:#101827;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 18px 60px #0005}#stage{width:100%;aspect-ratio:16/9}#stage svg{display:block;width:100%;height:100%}.controls{display:flex;gap:9px;align-items:center;padding:16px 0;flex-wrap:wrap}.controls input{flex:1;min-width:120px;accent-color:var(--blue)}#clock{font-variant-numeric:tabular-nums;font-size:12px;min-width:110px}details{border:1px solid var(--line);padding:13px 17px;border-radius:9px;margin-top:10px}summary{cursor:pointer;color:#b8cadd}#transcript{line-height:1.95;max-width:1000px;white-space:pre-line}#direction{line-height:1.8;color:var(--muted)}.export header,.export nav,.export .controls,.export details{display:none}.export .layout{display:block;min-height:0}.export main{padding:0}.export .screen-wrap{border:0;border-radius:0;box-shadow:none}.export #stage{width:1920px;height:1080px}.export{width:1920px;height:1080px;overflow:hidden}@media(max-width:900px){.layout{grid-template-columns:1fr}nav{max-height:180px;border-right:0;border-bottom:1px solid var(--line)}main{padding:10px}header strong{font-size:14px}}
</style></head><body>
<header><strong>计算机组成原理 <span class="muted">/ 120分钟学习工程</span></strong><span class="badge">大学课程 · 静音预览</span></header>
<div class="layout"><nav id="nav" aria-label="章节与镜头"></nav><main><div class="screen-wrap"><div id="stage" role="img" aria-label="课程动画"></div></div>
<div class="controls"><button id="prev" aria-label="上一镜">←</button><button id="play">播放</button><button id="next" aria-label="下一镜">→</button><input id="seek" type="range" min="0" max="7199.99" step="0.1" value="0" aria-label="全片进度"><span id="clock"></span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option selected value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="10">10×审片</option></select><button id="step">下一演示状态</button><button id="fullscreen">全屏</button></div>
<details open><summary>本镜头完整讲稿</summary><p id="transcript"></p></details><details><summary>分镜与适用条件</summary><p id="direction"></p></details></main></div>
<script>const COURSE=__COURSE_JSON__;const EXP=__EXPERIMENTS_JSON__;</script>
<script>__PLAYER_JS__</script></body></html>
